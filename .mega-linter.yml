---
# Configuration file for MegaLinter — https://megalinter.io/configuration/
APPLY_FIXES: all
ENABLE_LINTERS:
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - YAML_V8R
  - REPOSITORY_CHECKOV
  - REPOSITORY_TRIVY
  - REPOSITORY_TRIVY_SBOM
  - ACTION_ACTIONLINT
  - REPOSITORY_GITLEAKS
  - REPOSITORY_SYFT
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_GRYPE
  - PYTHON_BLACK
  - PYTHON_ISORT
  - PYTHON_RUFF
  - PYTHON_FLAKE8
DISABLE:
  - COPYPASTE
  - SPELL
DISABLE_LINTERS:
  - PYTHON_MYPY
  - PYTHON_PYLINT
  - PYTHON_PYRIGHT
  - PYTHON_BANDIT
  - REPOSITORY_KICS
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRUFFLEHOG
DISABLE_ERRORS_LINTERS:
  - YAML_YAMLLINT
PRINT_ALL_FILES: false
# Don't lint generated output, logs, or the local virtualenv
FILTER_REGEX_EXCLUDE: '(snmpScanner/|files/|logs/)'
REPORTERS_MARKDOWN_SUMMARY_TYPE: sections
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
EMAIL_REPORTER: false
FILEIO_REPORTER: false
JSON_REPORTER: true
GITHUB_STATUS_REPORTER: false
