[auth]
ocs_user = snmp
ocs_password = snmp

[api]
ocs_base_url = http://127.0.0.1:8000

[scanner]
# OFFLINE or ONLINE
scanner_mode = ONLINE
# path to a directory where snmp inventory files will be written if OFFLINE
local_inventory_dir = files
# comma separated values in CIDR format
targeted_subnets = 192.168.1.2/32,192.168.1.3/32,192.168.1.4/32,192.168.1.5/32,192.168.1.6/32
# can be INFO, DEBUG, WARNING, ERROR
log_level = DEBUG
# unique identifier for the scanner, either defined by the user or generated by the scanner
identifier = 
# MIBs directory for the scanner
mibs_dir = /path/to/mibs/
server_logging_enabled = true
server_log_level = DEBUG

